services:
  mongodb:
    image: mongo:7
    container_name: tesis-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS}
      MONGO_INITDB_DATABASE: ${MONGO_APP_DB}
      MONGO_APP_DB: ${MONGO_APP_DB}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASS: ${MONGO_APP_PASS}
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/init:/docker-entrypoint-initdb.d:ro

  backend:
    build: .
    container_name: tesis-backend
    depends_on:
      - mongodb
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MONGO_APP_DB: ${MONGO_APP_DB}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASS: ${MONGO_APP_PASS}

      AWS_REGION: ${AWS_REGION:-us-east-2}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_PRESIGNED_URL_DURATION_MINUTES: ${AWS_S3_PRESIGNED_URL_DURATION_MINUTES:-15}
      AWS_S3_FACES_PREFIX: ${AWS_S3_FACES_PREFIX:-faces/}
      AWS_SQS_QUEUE_URL: ${AWS_SQS_QUEUE_URL:-}
      AWS_SQS_RESULTS_QUEUE_URL: ${AWS_SQS_RESULTS_QUEUE_URL:-}
      VIDEO_JOB_UPLOADED_TIMEOUT_MINUTES: ${VIDEO_JOB_UPLOADED_TIMEOUT_MINUTES:-5}
      VIDEO_JOB_QUEUED_TIMEOUT_MINUTES: ${VIDEO_JOB_QUEUED_TIMEOUT_MINUTES:-720}
      VIDEO_JOB_PROCESSING_TIMEOUT_MINUTES: ${VIDEO_JOB_PROCESSING_TIMEOUT_MINUTES:-15}

volumes:
  mongo_data: