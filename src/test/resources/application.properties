spring.application.name=tesis-plataform-backend
app.time-zone=America/Bogota

spring.data.mongodb.uri=mongodb://localhost:27017/facecluster-test
spring.data.mongodb.auto-index-creation=false

aws.region=us-east-2
aws.s3.bucket=test-bucket
aws.s3.presigned-url-duration-minutes=15
aws.s3.faces-prefix=faces/

aws.sqs.queue-url=
aws.sqs.results-queue-url=

video-jobs.uploaded-timeout-minutes=5
video-jobs.queued-timeout-minutes=720
video-jobs.processing-timeout-minutes=15
video-jobs.results-poll-delay-ms=3600000
video-jobs.results-max-receives=5
video-jobs.stale-check-initial-delay-ms=3600000
video-jobs.stale-check-delay-ms=3600000
