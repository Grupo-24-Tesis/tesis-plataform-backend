spring.application.name=facecluster-backend

spring.application.name=tesis-plataform-backend
server.port=8080

spring.data.mongodb.uri=mongodb://${MONGO_APP_USER}:${MONGO_APP_PASS}@mongodb:27017/${MONGO_APP_DB}?authSource=${MONGO_APP_DB}

# AWS S3
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.s3.presigned-url-duration-minutes=${AWS_S3_PRESIGNED_URL_DURATION_MINUTES:15}