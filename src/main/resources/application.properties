spring.application.name=facecluster-backend

spring.application.name=tesis-plataform-backend
server.port=8080
app.time-zone=${APP_TIME_ZONE:America/Bogota}

spring.data.mongodb.uri=mongodb://${MONGO_APP_USER}:${MONGO_APP_PASS}@mongodb:27017/${MONGO_APP_DB}?authSource=${MONGO_APP_DB}
spring.data.mongodb.auto-index-creation=true

aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.s3.presigned-url-duration-minutes=${AWS_S3_PRESIGNED_URL_DURATION_MINUTES:15}
aws.s3.faces-prefix=${AWS_S3_FACES_PREFIX:faces/}

aws.sqs.queue-url=${AWS_SQS_QUEUE_URL:}
aws.sqs.results-queue-url=${AWS_SQS_RESULTS_QUEUE_URL:}

video-jobs.uploaded-timeout-minutes=${VIDEO_JOB_UPLOADED_TIMEOUT_MINUTES:5}
video-jobs.queued-timeout-minutes=${VIDEO_JOB_QUEUED_TIMEOUT_MINUTES:720}
video-jobs.processing-timeout-minutes=${VIDEO_JOB_PROCESSING_TIMEOUT_MINUTES:15}
video-jobs.results-poll-delay-ms=5000
video-jobs.results-max-receives=5
video-jobs.stale-check-initial-delay-ms=120000
video-jobs.stale-check-delay-ms=60000
